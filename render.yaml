# Configurazione per Render — VERSIONE ATTIVA: MULTI-LOCALE, dati permanenti.
# UN solo server per TUTTI i bar: ognuno ha il suo database separato.
#
# E' questo il file che Render legge. I dati NON si azzerano: vivono su un
# disco che Render conserva a ogni aggiornamento dell'app.
# Costo indicativo: piano Starter ~7 $/mese + disco 0,25 $/GB al mese.
#
# Se un giorno vuoi tornare al piano gratuito (i dati si azzererebbero):
#   1. Rinomina questo file in  render-DATI-PERMANENTI.yaml
#   2. Rinomina  render-GRATIS.yaml  in  render.yaml
#   3. Ricarica su GitHub: Render si aggiorna da solo.
services:
  - type: web
    name: barback-app
    region: frankfurt
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node --experimental-sqlite server.js
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      # Render genera da solo una chiave segreta sicura per i token di accesso.
      - key: JWT_SECRET
        generateValue: true
      # Tutti i locali vivono sul disco persistente, non dentro l'app:
      # /var/data/locali.db (l'elenco) e /var/data/locali/<codice>.db (uno per bar)
      - key: DATA_DIR
        value: /var/data
      # La chiave per il pannello /admin.html (elenco locali, sospendere chi non paga).
      # La trovi su Render -> barback-app -> Environment.
      - key: ADMIN_KEY
        generateValue: true
    disk:
      name: barback-dati
      mountPath: /var/data
      sizeGB: 1
